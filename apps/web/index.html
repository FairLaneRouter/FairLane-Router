<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />

    <!--
      The API request starts here, not from React, and it is the most
      valuable lever on the first screen. Before, the chain was serial: HTML →
      styles → bundle (86 KB) → execution → only then fetch. On 3G the first
      request left at 1.7 s and the page saw data only at 2.5 s. Here it goes
      out with the first lines of the document, in parallel with everything else.

      The address is baked in at build time: Vite substitutes `%VITE_API_URL%`
      in HTML just as it does `import.meta.env` in code. An empty value means
      the same domain — `base` is then empty and the path stays relative.

      The promise is kept with its rejection already silenced: the bundle
      arrives a second later and attaches its own handler, and by then the
      browser would have declared it "unhandled" and logged an error.
    -->
    <script>
      ;(() => {
        const base = '%VITE_API_URL%'.replace(/\/+$/, '')
        const at = Date.now()
        const summary = fetch(`${base}/v1/summary?window=1h`).then((response) => {
          if (!response.ok) throw new Error(`API відповів ${response.status}`)
          return response.json()
        })

        summary.catch(() => {})
        window.__fairlanePreload = { window: '1h', at, summary }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fonts do not block rendering. Styles from another domain held the CSSOM
      back by 1.2 s, and module execution with it — scripts wait for styles.
      `media="print"` takes them off the critical path, `onload` switches them
      back on. The price is a brief moment in a system font; it is cheaper
      than a table that is not there yet.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>FairLane Router — landing cost board</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
