# The landing page and the dashboard on GitHub Pages, as one artifact: the
# static landing (apps/landing) at the site root, the dashboard under /app/.
# Built on every push to main and published through Actions — there is no
# gh-pages branch. The owner once sets Settings → Pages → Source = GitHub
# Actions; without it the deploy step fails with 404.
#
# Build variables — Settings → Secrets and variables → Actions → Variables:
#   VITE_API_URL     public address of the API (baked into the bundle, not a secret)
#   PAGES_BASE_PATH  custom domain only: "/app/" instead of "/<repo>/app/"
name: pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/landing/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An empty API address would mean "the same domain" — on Pages that is a
      # 404 on every request and a "no data" screen. Better to fail the build
      # and say why.
      - run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Repository variable VITE_API_URL is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
      - run: pnpm --filter @fairlane/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # The dashboard has no router — its views are state, not addresses — so
      # nothing below /app/ needs a 404 fallback.
      - run: |
          mkdir -p _site
          cp -r apps/landing/. _site/
          cp -r apps/web/dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
