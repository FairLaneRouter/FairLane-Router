# Render Free засинає після 15 хвилин без HTTP-запитів; для індексатора всередині
# API це прогалина в даних. Пінг раз на 5 хвилин — розклад GitHub запізнюється
# на хвилини, тож */10 інколи не встигав би. 750 безкоштовних годин на місяць
# покривають один сервіс цілодобово.
#
# GitHub вимикає розклад після 60 днів без комітів — тоді увімкнути руками
# в Actions. Адреса — та сама змінна репозиторію, що й у збірки веба.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::warning::VITE_API_URL не задана — пінгувати нема кого"
            exit 0
          fi
          curl -sSf --max-time 120 "${{ vars.VITE_API_URL }}/health" | cut -c1-120
